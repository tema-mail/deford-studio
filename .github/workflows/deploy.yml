name: Сборка и выкладка на Beget

# Код живёт здесь, на сервере – только готовые файлы. Каждый пуш в main собирает сайт и выкладывает его на
# VPS Beget (deford.ru за общим Caddy). Ключ выкладки умеет только загрузить сборку, включить её и откатить
# (deploy/receive.sh на сервере); последние 5 выкладок хранятся для отката (workflow «Откат сайта»).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-beget
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Закрыть сайт от поисковиков (как было на GitHub Pages)
        # Блочный скаляр: внутри строки есть «: », и YAML принимает её только так
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
      - name: Закрыть кабинет логином и паролем
        # Шифрует dist/admin целиком. Без секретов падает намеренно,
        # чтобы админка не уехала на сервер открытой.
        env:
          ADMIN_LOGIN: ${{ secrets.ADMIN_LOGIN }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: node scripts/lock-admin.mjs
      - name: Ключ выкладки
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Загрузить сборку (только изменённые файлы)
        run: rsync -a --delete --link-dest=/releases/current -e "ssh -i ~/.ssh/deploy -o BatchMode=yes" dist/ deford-deploy@45.12.72.227:incoming/
      - name: Включить выкладку
        run: ssh -i ~/.ssh/deploy -o BatchMode=yes deford-deploy@45.12.72.227 "activate ${GITHUB_SHA::12}"
      - name: Проверить сайт снаружи
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 https://deford.ru/)
          echo "https://deford.ru/ → $code"
          test "$code" = 200
