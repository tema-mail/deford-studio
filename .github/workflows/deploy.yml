name: Сборка и публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Свой домен в настройках Pages (deford.ru) — сайт живёт в корне,
      # префикс не нужен. Без домена — адрес tema-mail.github.io/deford-studio/.
      - name: Проставить префикс подпапки GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # без глушения ошибок: не прочитали настройки — сборка падает,
          # а не публикуется с неверными путями
          CNAME=$(gh api "repos/${{ github.repository }}/pages" --jq '.cname // ""')
          echo "домен в настройках Pages: ${CNAME:-нет}"
          if [ -n "$CNAME" ]; then
            echo "свой домен $CNAME — пути остаются корневыми"
          else
            node scripts/rebase-dist.mjs /deford-studio
          fi
      - name: Закрыть копию от поисковиков
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
      - name: Запретить Jekyll обрабатывать сборку
        run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
