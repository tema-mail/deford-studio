# Сайт Дефорда на VPS Beget: статика из /opt/deford-site/releases/current, наружу – через общий Caddy.
# Порты не публикуются: Caddy ходит к контейнеру по сети dzenbot_default.
name: deford-site
services:
  deford-site-web:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: deford-site-web
    restart: unless-stopped
    volumes:
      - /opt/deford-site/releases:/srv:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    networks:
      - proxy
networks:
  proxy:
    external: true
    name: dzenbot_default
