# Текущая выкладка – символическая ссылка /srv/current → /srv/<коммит>; переключение версии атомарное.
server {
  listen 8080;
  server_tokens off;
  absolute_redirect off;
  root /srv/current;
  index index.html;
  location / {
    try_files $uri $uri/ $uri.html =404;
  }
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  error_page 404 /404.html;
}
