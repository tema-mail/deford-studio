name: Временная диагностика DNS deford.ru
on: workflow_dispatch
permissions:
  contents: read
jobs:
  dig:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq dnsutils >/dev/null 2>&1 || true
          for ns in ns1.reg.ru ns2.reg.ru 8.8.8.8 1.1.1.1; do
            for t in A AAAA CAA; do
              st=$(dig +time=5 +tries=2 $t deford.ru @$ns | grep -oE 'status: [A-Z]+' | head -1)
              echo "$ns $t ${st:-нет ответа}"
            done
          done
          echo "--- www CNAME @8.8.8.8: $(dig +short www.deford.ru @8.8.8.8 | tr '\n' ' ')"
          echo "--- IP ns1/ns2: $(dig +short ns1.reg.ru) / $(dig +short ns2.reg.ru)"
